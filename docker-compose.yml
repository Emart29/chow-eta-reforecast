# Local stack: the serving API and the monitoring dashboard.
services:
  api:
    build: .
    ports:
      - "8000:8000"

  dashboard:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r dashboard/requirements.txt &&
             streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "8501:8501"
